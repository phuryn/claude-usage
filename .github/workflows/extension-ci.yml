name: VS Code extension tests

on:
  push:
    branches: [main, DEV]
    paths:
      - "vscode-extension/**"
      - ".github/workflows/extension-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "vscode-extension/**"
      - ".github/workflows/extension-ci.yml"

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension

    steps:
      # SECURITY [H-2]: SHA-pinned to prevent supply-chain attacks via floating tags.
      # Update SHAs when upgrading action versions:
      #   curl -s https://api.github.com/repos/actions/<name>/git/ref/tags/vX | jq -r .object.sha
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # actions/checkout@v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vscode-extension/package-lock.json

      - run: npm ci

      - name: Type-check
        run: npx tsc -p . --noEmit

      - name: Run tests
        run: npm test

      - name: Package .vsix
        run: npm run package

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # actions/upload-artifact@v5
        with:
          name: claude-usage-extension-vsix
          path: vscode-extension/*.vsix
          if-no-files-found: error
          retention-days: 14
